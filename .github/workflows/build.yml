name: Build Docker Image

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
          - arch: arm64
            target: aarch64-unknown-linux-musl
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install musl and cross compilers
      run: |
        sudo apt-get update
        sudo apt-get install -y musl-tools
        if [ "${{ matrix.arch }}" = "arm64" ]; then
          sudo apt-get install -y gcc-aarch64-linux-gnu
        fi

    - name: Install cross
      run: |
        curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
        cargo binstall --no-confirm cross

    - name: Build Rust binary with cross
      run: |
        cross build --release --target ${{ matrix.target }}
        mkdir -p dist-bin
        cp target/${{ matrix.target }}/release/xread dist-bin/xread-${{ matrix.arch }}

    - name: Upload Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: xread-${{ matrix.arch }}
        path: dist-bin/xread-${{ matrix.arch }}

  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Build frontend
      run: |
        cd frontend
        npm ci
        npm run build

    - name: Upload Frontend Artifact
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: frontend/dist

  build-and-push-images:
    needs: [build-binaries, build-frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
    - uses: actions/checkout@v4

    - name: Download Frontend
      uses: actions/download-artifact@v4
      with:
        name: frontend-dist
        path: frontend/dist

    - name: Download Binary
      uses: actions/download-artifact@v4
      with:
        name: xread-${{ matrix.arch }}
        path: bin

    - name: Make binary executable
      run: chmod +x bin/xread-${{ matrix.arch }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: Charmillionaire
        password: ${{ secrets.GHCR_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=ref,event=tag
          type=raw,value=latest
          type=sha,prefix=
        flavor: |
          suffix=-${{ matrix.arch }}

    - name: Build and push single-arch image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile.matrix
        platforms: linux/${{ matrix.arch }}
        build-args: TARGETARCH=${{ matrix.arch }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  merge-manifests:
    needs: build-and-push-images
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: Charmillionaire
        password: ${{ secrets.GHCR_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=ref,event=tag
          type=raw,value=latest
          type=sha,prefix=

    - name: Create and push multi-arch manifest
      run: |
        TAGS=$(echo "${{ steps.meta.outputs.tags }}" | tr '\n' ' ')
        for tag in $TAGS; do
          if [ -n "$tag" ]; then
            echo "Merging manifest for tag: $tag"
            docker buildx imagetools create -t "$tag" \
              "${tag}-amd64" \
              "${tag}-arm64"
          fi
        done

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        gh release create "${{ github.ref_name }}" \
          --title "${{ github.ref_name }}" \
          --generate-notes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
